 <title id="dipapprox-optimization-title">Optimization result for one SVT-Gauss comparison</title>
 <desc id="dipapprox-optimization-desc">Reported results from Table 2 for SVT-Gauss with N equal to 5 on one selected adjacent input pair. The unoptimized analysis timed out at the 600-second limit; its completed runtime is unknown. The optimized runtime was 7.9 seconds, the mean of three runs. Maximum nesting depth decreased from 6 to 3. The runtime axis is logarithmic. These values do not describe an exhaustive check of all adjacent pairs.</desc>
