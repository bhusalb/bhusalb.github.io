 <title id="dipapprox-privacy-intervals-title">Privacy decisions from rigorous intervals</title>
 <desc id="dipapprox-privacy-intervals-desc">An illustrative decision chart, not experimental results. At delta equal to 0.10, bounds of 0.04 to 0.08 on the maximum privacy gap certify DP, bounds of 0.12 to 0.16 establish Not_DP, and bounds of 0.08 to 0.13 leave the answer Unknown. DP requires upper bounds for all relevant adjacent input pairs; a privacy violation requires a witness with a lower bound above delta.</desc>
